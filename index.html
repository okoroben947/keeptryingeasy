<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Easyconnect Group - Loading</title>
    <style>
        :root {
            /* logo1.png is now a true transparent PNG (background removed),
               so this can be any page background color you like -- there's
               no more need to match it to the logo's own background, since
               the logo no longer has one. */
            --main-bg-color: #ffffff; 
            
            /* Logo Colors */
            --logo-blue: #17365c;
            --logo-orange: #d98218;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* The page now uses the exact same color as your logo background */
            background-color: var(--main-bg-color); 
            height: 100vh;
            height: 100dvh; /* accounts for mobile browser address bars shifting the viewport */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            position: relative; 
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
            /* Lets the whole page gently fade out once .exiting is added,
               right before handing off to register.html. */
            transition: opacity 1s ease-in;
        }

        /* --- Bubble Background Styles --- */
        .bubbles-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none; 
        }

        .bubble {
            position: absolute;
            bottom: -250px; 
            border-radius: 50%;
            opacity: 0.12; 
            animation: floatUp infinite ease-in-out;
        }

        .bubble-blue { background-color: var(--logo-blue); }
        .bubble-orange { background-color: var(--logo-orange); }

        /* On small screens, the largest bubbles (up to 240px) can dominate
           a narrow viewport. Scaling the whole container -- rather than
           individual .bubble elements -- avoids fighting the bubbles' own
           floatUp animation, since a CSS animation's transform fully
           overrides any static transform set directly on the same element. */
        @media (max-width: 480px) {
            .bubbles-container {
                transform: scale(0.7);
                transform-origin: center;
            }
        }

        /* Randomized sizes and positions */
        .bubble:nth-child(1) { left: 5%; width: 160px; height: 160px; animation-duration: 12s; animation-delay: 0s; }
        .bubble:nth-child(2) { left: 20%; width: 100px; height: 100px; animation-duration: 15s; animation-delay: 2s; }
        .bubble:nth-child(3) { left: 35%; width: 220px; height: 220px; animation-duration: 18s; animation-delay: 4s; }
        .bubble:nth-child(4) { left: 50%; width: 120px; height: 120px; animation-duration: 14s; animation-delay: 1s; }
        .bubble:nth-child(5) { left: 65%; width: 180px; height: 180px; animation-duration: 16s; animation-delay: 3s; }
        .bubble:nth-child(6) { left: 80%; width: 90px; height: 90px; animation-duration: 11s; animation-delay: 5s; }
        .bubble:nth-child(7) { left: 10%; width: 190px; height: 190px; animation-duration: 19s; animation-delay: 7s; }
        .bubble:nth-child(8) { left: 45%; width: 140px; height: 140px; animation-duration: 13s; animation-delay: 6s; }
        .bubble:nth-child(9) { left: 75%; width: 240px; height: 240px; animation-duration: 17s; animation-delay: 8s; }
        .bubble:nth-child(10) { left: 90%; width: 110px; height: 110px; animation-duration: 14s; animation-delay: 2s; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            10% {
                opacity: 0.12; 
            }
            50% {
                transform: translateY(-50vh) translateX(30px) scale(1.1);
            }
            90% {
                opacity: 0.12; 
            }
            100% {
                transform: translateY(-120vh) translateX(-30px) scale(1);
                opacity: 0;
            }
        }
        /* -------------------------------- */

        /* --- Falling Rain Styles ---
           Sits above the rising bubbles but below the logo/text, so rain
           reads as falling through the scene behind the branding, not
           on top of it and distracting from it. */
        .rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            overflow: hidden;
            pointer-events: none;
        }

        .raindrop {
            position: absolute;
            top: -160px;
            width: 3px;
            height: 110px;
            border-radius: 3px;
            background: linear-gradient(to bottom, transparent, var(--logo-blue), transparent);
            opacity: 0;
            animation: rainFall linear infinite;
        }

        @keyframes rainFall {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0;
            }
            8% {
                opacity: 0.3;
            }
            85% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(130vh) translateX(-18px);
                opacity: 0;
            }
        }

        /* Randomized horizontal position, speed, and start delay per drop so
           the rain doesn't look like it's falling in uniform, robotic rows. */
        .raindrop:nth-child(1)  { left: 3%;  height: 95px;  animation-duration: 2.0s; animation-delay: 0s;    }
        .raindrop:nth-child(2)  { left: 10%; height: 130px; animation-duration: 1.6s; animation-delay: 0.4s;  }
        .raindrop:nth-child(3)  { left: 17%; height: 90px;  animation-duration: 2.3s; animation-delay: 1.1s;  }
        .raindrop:nth-child(4)  { left: 24%; height: 145px; animation-duration: 1.8s; animation-delay: 0.2s;  }
        .raindrop:nth-child(5)  { left: 31%; height: 105px; animation-duration: 2.1s; animation-delay: 1.6s;  }
        .raindrop:nth-child(6)  { left: 38%; height: 120px; animation-duration: 1.7s; animation-delay: 0.7s; }
        .raindrop:nth-child(7)  { left: 45%; height: 95px;  animation-duration: 2.05s; animation-delay: 2.1s; }
        .raindrop:nth-child(8)  { left: 52%; height: 135px; animation-duration: 1.85s; animation-delay: 0.9s; }
        .raindrop:nth-child(9)  { left: 59%; height: 90px;  animation-duration: 2.25s; animation-delay: 1.4s; }
        .raindrop:nth-child(10) { left: 66%; height: 115px; animation-duration: 1.6s;  animation-delay: 0.1s; }
        .raindrop:nth-child(11) { left: 73%; height: 145px; animation-duration: 2.0s;  animation-delay: 1.9s; }
        .raindrop:nth-child(12) { left: 80%; height: 95px;  animation-duration: 2.3s;  animation-delay: 0.5s; }
        .raindrop:nth-child(13) { left: 87%; height: 120px; animation-duration: 1.8s;  animation-delay: 1.2s; }
        .raindrop:nth-child(14) { left: 94%; height: 105px; animation-duration: 2.15s; animation-delay: 2.4s; }
        .raindrop:nth-child(15) { left: 55%; height: 90px;  animation-duration: 1.5s;  animation-delay: 2.8s; }
        .raindrop:nth-child(16) { left: 28%; height: 130px; animation-duration: 2.05s; animation-delay: 0.6s; }
        /* ------------------------------ */

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(16px, 4vw, 32px); 
            z-index: 10; 
        }

        .logo-wrapper {
            width: clamp(140px, 40vmin, 280px); 
            height: clamp(140px, 40vmin, 280px);
            display: flex;
            justify-content: center;
            align-items: center;
            /* Noticeably breathing pulse while the splash screen is up --
               see the keyframes below for the actual scale amount. */
            animation: slowZoom 6s ease-in-out infinite;
        }

        .logo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            /* logo1.png has a real transparent background with clean edges
               already (background removed properly, not faked with a mask),
               so the old clip-path/radial-mask workarounds that used to hide
               logo.png's solid white canvas are no longer needed -- and would
               only risk softening the real artwork's edges for no reason. */
        }

        .brand-name {
            color: var(--logo-blue); 
            font-size: clamp(1.1rem, 5vw, 1.75rem); 
            font-weight: 700;
            letter-spacing: 1px;
            text-align: center;
            animation: pulseText 3s ease-in-out infinite;
        }

        @keyframes slowZoom {
            /* Noticeable breathing pulse: 100% -> 112% -> 100%, big enough
               to clearly read as motion during the load, without being the
               original jarring 115% snap. */
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* --- Exit transition (added when the 30s timer fires, right before
           handing off to register.html) ---
           .exiting on <body> fades the whole page out. The logo additionally
           gets its own gentle zoom-OUT as it fades, on top of that -- its
           infinite pulse animation is switched off first so the two don't
           fight each other, then a one-shot transition takes it down to a
           smaller scale. The brand text's pulse is stopped too, so nothing
           is still animating mid-fade. */
        body.exiting {
            opacity: 0;
        }

        body.exiting .logo-wrapper {
            animation: none;
            transition: transform 1s ease-in;
            transform: scale(0.6);
        }

        body.exiting .brand-name {
            animation: none;
        }

        /* --- Loading Bar Styles --- */
        .loading-bar-container {
            width: clamp(140px, 40vmin, 280px); /* Matches logo width perfectly */
            height: 6px;
            background-color: rgba(23, 54, 92, 0.15); /* Faint blue matching logo palette */
            border-radius: 4px;
            overflow: hidden;
            margin-top: -10px; /* Pulls it slightly closer to the image */
        }

        .loading-bar {
            height: 100%;
            width: 0%;
            background-color: red;
            /* Fills over 30 seconds, turning green at the very end (98% to 100%) */
            animation: fillBar 30s linear forwards; 
        }

        @keyframes fillBar {
            0% { 
                width: 0%; 
                background-color: red;
            }
            98% { 
                width: 98%; 
                background-color: red;
            }
            100% { 
                width: 100%; 
                background-color: #28a745; /* Turns green right at completion */
            }
        }

        /* ==========================================================
           NEW (additive): Nigeria @66 Independence celebration
           Tiny flowers pop and blow outward in bursts over the page.
           Nothing above was changed or removed.
           ========================================================== */
        .flower-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;            /* above logo + rain so the pops are seen */
            overflow: hidden;
            pointer-events: none;   /* never blocks taps/clicks */
        }

        .flower {
            position: absolute;
            top: 0;
            left: 0;
            will-change: transform, opacity;
            opacity: 0;
        }

        .flower svg {
            display: block;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 1px 1.5px rgba(0, 0, 0, 0.18));
        }

        /* The existing "NIGERIA @66" line had no styling; this gives it a
           green celebratory pop-in without touching its text or markup. */
        .independence-day {
            color: #008751;
            font-weight: 700;
            font-size: clamp(0.85rem, 3.6vw, 1.2rem);
            letter-spacing: 0.5px;
            text-align: center;
            animation:
                independencePop 1s cubic-bezier(0.2, 1.4, 0.4, 1) both,
                independenceGlow 2.5s ease-in-out 1s infinite;
        }

        @keyframes independencePop {
            0%   { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1);   opacity: 1; }
        }

        @keyframes independenceGlow {
            0%, 100% { text-shadow: 0 0 0 rgba(0, 135, 81, 0); }
            50%      { text-shadow: 0 0 10px rgba(0, 135, 81, 0.45); }
        }

        body.exiting .independence-day {
            animation: none;
        }

        /* ==========================================================
           NEW (additive): Party-popper cannons + lingering flowers
           ========================================================== */
        .flower {
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
        }

        .popper {
            position: fixed;
            width: 64px;
            height: 104px;
            z-index: 21;
            pointer-events: none;
            transform-origin: 50% 100%;
        }
        .popper svg {
            width: 100%;
            height: 100%;
            display: block;
            transform-origin: 50% 100%;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.28));
        }
        .popper .mouth {
            position: absolute;
            left: 50%;
            top: 25%;
            width: 2px;
            height: 2px;
        }
        .popper.fire svg { animation: popperRecoil 0.4s ease-out; }
        @keyframes popperRecoil {
            0%   { transform: scale(1.1, 0.86); }
            40%  { transform: scale(0.95, 1.07); }
            100% { transform: scale(1, 1); }
        }
        .popper.p1 { left: 12px;  bottom: -8px; transform: rotate(28deg); }
        .popper.p2 { right: 12px; bottom: -8px; transform: rotate(-28deg); }
        .popper.p3 { left: -16px;  bottom: 36%; transform: rotate(62deg); }
        .popper.p4 { right: -16px; bottom: 36%; transform: rotate(-62deg); }
    </style>
</head>

    <!-- NEW: Independence flower-burst layer (flowers are added by the script at the bottom) -->
    <div class="flower-layer" id="flowerLayer" aria-hidden="true"></div>

    <!-- NEW: party-popper cannons (fire flowers all over the page) -->
    <div class="popper p1" data-angle="28" data-power="1.25"><svg viewBox="0 0 64 104" xmlns="http://www.w3.org/2000/svg"><path d="M22 102h20L58 26H6z" fill="#008751"/><polygon points="15.3,70 48.7,70 46.2,82 17.8,82" fill="#fff"/><polygon points="10.6,48 53.4,48 50.8,60 13.2,60" fill="#d98218"/><path d="M14 30L26 100" stroke="#fff" opacity=".28" stroke-width="3" stroke-linecap="round"/><rect x="21" y="100" width="22" height="4" rx="2" fill="#17365c"/><ellipse cx="32" cy="26" rx="27" ry="8" fill="#ffd23f"/><ellipse cx="32" cy="26" rx="22" ry="5.5" fill="#0b3d2a"/></svg><span class="mouth"></span></div>
    <div class="popper p2" data-angle="-28" data-power="1.25"><svg viewBox="0 0 64 104" xmlns="http://www.w3.org/2000/svg"><path d="M22 102h20L58 26H6z" fill="#008751"/><polygon points="15.3,70 48.7,70 46.2,82 17.8,82" fill="#fff"/><polygon points="10.6,48 53.4,48 50.8,60 13.2,60" fill="#d98218"/><path d="M14 30L26 100" stroke="#fff" opacity=".28" stroke-width="3" stroke-linecap="round"/><rect x="21" y="100" width="22" height="4" rx="2" fill="#17365c"/><ellipse cx="32" cy="26" rx="27" ry="8" fill="#ffd23f"/><ellipse cx="32" cy="26" rx="22" ry="5.5" fill="#0b3d2a"/></svg><span class="mouth"></span></div>
    <div class="popper p3" data-angle="62" data-power="1.0"><svg viewBox="0 0 64 104" xmlns="http://www.w3.org/2000/svg"><path d="M22 102h20L58 26H6z" fill="#008751"/><polygon points="15.3,70 48.7,70 46.2,82 17.8,82" fill="#fff"/><polygon points="10.6,48 53.4,48 50.8,60 13.2,60" fill="#d98218"/><path d="M14 30L26 100" stroke="#fff" opacity=".28" stroke-width="3" stroke-linecap="round"/><rect x="21" y="100" width="22" height="4" rx="2" fill="#17365c"/><ellipse cx="32" cy="26" rx="27" ry="8" fill="#ffd23f"/><ellipse cx="32" cy="26" rx="22" ry="5.5" fill="#0b3d2a"/></svg><span class="mouth"></span></div>
    <div class="popper p4" data-angle="-62" data-power="1.0"><svg viewBox="0 0 64 104" xmlns="http://www.w3.org/2000/svg"><path d="M22 102h20L58 26H6z" fill="#008751"/><polygon points="15.3,70 48.7,70 46.2,82 17.8,82" fill="#fff"/><polygon points="10.6,48 53.4,48 50.8,60 13.2,60" fill="#d98218"/><path d="M14 30L26 100" stroke="#fff" opacity=".28" stroke-width="3" stroke-linecap="round"/><rect x="21" y="100" width="22" height="4" rx="2" fill="#17365c"/><ellipse cx="32" cy="26" rx="27" ry="8" fill="#ffd23f"/><ellipse cx="32" cy="26" rx="22" ry="5.5" fill="#0b3d2a"/></svg><span class="mouth"></span></div>

    <!-- Main Content -->

    <script>
        // At 30 seconds: start the gentle fade-out + logo zoom-out, then
        // redirect once that 1-second transition has actually finished --
        // rather than cutting straight to register.html mid-animation.
        setTimeout(() => {
            document.body.classList.add('exiting');
            setTimeout(() => {
                window.location.href = 'register.html';
            }, 1000);
        }, 30000);
    </script>

    <!-- NEW (additive): party-popper flower celebration (continuous, flowers linger) -->
    <script>
        (function () {
            var layer = document.getElementById('flowerLayer');
            var poppers = Array.prototype.slice.call(document.querySelectorAll('.popper'));
            if (!layer) return;

            var reduced = window.matchMedia &&
                window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            var small = window.innerWidth < 600;
            var density = (reduced ? 0.4 : 1) * (small ? 0.65 : 1);
            var MAX = Math.max(90, Math.round(280 * density));

            // [outer petals, inner petals, centre]
            var palettes = [
                ['#008751', '#7ee0ad', '#ffd23f'],
                ['#ffffff', '#d6f5e4', '#008751'],
                ['#ff6f9f', '#ffc2d6', '#ffd23f'],
                ['#d98218', '#ffc66b', '#17365c'],
                ['#ffd23f', '#fff2a8', '#d98218'],
                ['#6b5be6', '#c3bcff', '#ffd23f'],
                ['#17365c', '#6f93c6', '#ffd23f'],
                ['#e8403f', '#ff9d9b', '#ffffff']
            ];

            function ring(n, shape, fill, rot0) {
                var s = '';
                for (var i = 0; i < n; i++) {
                    s += '<g transform="rotate(' + (rot0 + i * 360 / n) + ')">' + shape.replace('FILL', fill) + '</g>';
                }
                return s;
            }
            var stroke = ' stroke="rgba(0,100,60,.45)" stroke-width=".5"';

            function makeSprite(kind, c) {
                var body = '';
                if (kind === 0) {            // round 5-petal blossom, two layers
                    body = ring(5, '<ellipse cx="0" cy="-6.2" rx="4.3" ry="6.4" fill="FILL"' + stroke + '/>', c[0], 0) +
                           ring(5, '<ellipse cx="0" cy="-3.4" rx="2.4" ry="3.8" fill="FILL"/>', c[1], 36) +
                           '<circle r="2.6" fill="' + c[2] + '"/><circle r="1" cx="-.8" cy="-.8" fill="#fff" opacity=".6"/>';
                } else if (kind === 1) {     // 8-petal daisy
                    body = ring(8, '<ellipse cx="0" cy="-7.4" rx="2.5" ry="5.2" fill="FILL"' + stroke + '/>', c[0], 0) +
                           ring(8, '<ellipse cx="0" cy="-4.2" rx="1.4" ry="2.6" fill="FILL"/>', c[1], 22.5) +
                           '<circle r="3.4" fill="' + c[2] + '" stroke="rgba(0,0,0,.2)" stroke-width=".4"/>';
                } else {                     // pointed 6-petal lily/star bloom
                    var pet = '<path d="M0 0C-5.5-4.5-4.5-10.5 0-13C4.5-10.5 5.5-4.5 0 0Z" fill="FILL"' + stroke + '/>';
                    var pet2 = '<path d="M0 0C-3-2.5-2.5-6 0-7.2C2.5-6 3-2.5 0 0Z" fill="FILL"/>';
                    body = ring(6, pet, c[0], 0) + ring(6, pet2, c[1], 30) + '<circle r="2" fill="' + c[2] + '"/>';
                }
                var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-13 -13 26 26">' + body + '</svg>';
                return 'url("data:image/svg+xml;utf8,' + encodeURIComponent(svg) + '")';
            }

            var sprites = [];
            for (var k = 0; k < 3; k++) {
                for (var j = 0; j < palettes.length; j++) {
                    sprites.push(makeSprite(k, palettes[j]));
                }
            }

            function rand(a, b) { return a + Math.random() * (b - a); }
            var particles = [];
            var vw = window.innerWidth, vh = window.innerHeight;
            window.addEventListener('resize', function () { vw = window.innerWidth; vh = window.innerHeight; });

            function spawn(x, y, vx, vy, fall) {
                if (particles.length >= MAX) return;
                var size = rand(15, 32) * (small ? 0.85 : 1);
                var el = document.createElement('div');
                el.className = 'flower';
                el.style.width = size + 'px';
                el.style.height = size + 'px';
                el.style.backgroundImage = sprites[Math.floor(Math.random() * sprites.length)];
                layer.appendChild(el);
                particles.push({
                    el: el, half: size / 2, x: x, y: y, vx: vx, vy: vy,
                    fall: fall, rot: rand(0, 360), vr: rand(-140, 140),
                    fp: rand(0, 6.28), ff: rand(1.5, 4), sp: rand(0, 6.28), sf: rand(0.8, 2.2),
                    age: 0
                });
            }

            function firePopper(el, boost) {
                var m = el.querySelector('.mouth').getBoundingClientRect();
                var cx = m.left + m.width / 2, cy = m.top + m.height / 2;
                var theta = parseFloat(el.getAttribute('data-angle')) * Math.PI / 180;
                var power = parseFloat(el.getAttribute('data-power')) * vh;
                var n = Math.round(rand(26, 38) * (boost || 1) * density);
                for (var i = 0; i < n; i++) {
                    var a = theta + rand(-0.5, 0.5);
                    var sp = rand(0.55, 1.25) * power;
                    spawn(cx, cy, Math.sin(a) * sp, -Math.cos(a) * sp, rand(55, 105));
                }
                el.classList.remove('fire');
                void el.offsetWidth;
                el.classList.add('fire');
            }

            function frame(now) {
                var dt = Math.min(0.05, (now - last) / 1000);
                last = now;

                // Cannons keep firing in turn, flowers keep drifting in from the top.
                if (!document.hidden) {
                    if (now > nextFire) {
                        if (poppers.length) firePopper(poppers[fireIdx++ % poppers.length]);
                        nextFire = now + 650;
                    }
                    if (now > nextAmbient) {
                        spawn(rand(0, vw), -30, rand(-20, 20), rand(40, 90), rand(55, 100));
                        nextAmbient = now + rand(220, 380);
                    }
                }

                var decay = Math.exp(-1.5 * dt);
                for (var i = particles.length - 1; i >= 0; i--) {
                    var p = particles[i];
                    p.age += dt;
                    // Drift toward a slow, swaying fall (so flowers float and linger).
                    var tx = Math.sin(p.age * p.sf + p.sp) * 38;
                    p.vx = tx + (p.vx - tx) * decay;
                    p.vy = p.fall + (p.vy - p.fall) * decay;
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;
                    p.rot += p.vr * dt;
                    p.fp += p.ff * dt;

                    // Only fade right at the bottom edge, never mid-air.
                    var o = p.y > vh - 30 ? Math.max(0, (vh + 30 - p.y) / 60) : 1;
                    if (o <= 0 || p.y < -600 || p.x < -80 || p.x > vw + 80) {
                        p.el.remove();
                        particles.splice(i, 1);
                        continue;
                    }
                    var pop = Math.min(1, p.age / 0.18);                 // quick pop-in
                    var flip = 0.35 + 0.65 * Math.abs(Math.cos(p.fp));   // confetti flutter
                    p.el.style.opacity = o;
                    p.el.style.transform = 'translate3d(' + (p.x - p.half) + 'px,' + (p.y - p.half) + 'px,0) rotate(' +
                        p.rot + 'deg) scale(' + (pop * flip) + ',' + pop + ')';
                }
                requestAnimationFrame(frame);
            }

            var last = performance.now();
            var fireIdx = 0;
            var nextAmbient = last + 300;
            var nextFire = last + 650;

            // Grand opening: all cannons fire together, a little bigger.
            setTimeout(function () { poppers.forEach(function (el) { firePopper(el, 1.3); }); }, 350);

            // Tap/click anywhere for an extra burst of lingering flowers.
            document.addEventListener('pointerdown', function (e) {
                var n = Math.round(20 * density);
                for (var i = 0; i < n; i++) {
                    var a = rand(0, Math.PI * 2), sp = rand(150, 450);
                    spawn(e.clientX, e.clientY, Math.cos(a) * sp, Math.sin(a) * sp, rand(55, 105));
                }
            });

            requestAnimationFrame(frame);
        })();
    </script>

</body>
</html>
