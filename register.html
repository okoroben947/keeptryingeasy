<!DOCTYPE html>
<html lang="en" class="min-h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark light">
    <title>EasyConnect - Client Registration</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Tell mobile browsers (Android/Samsung "auto dark", iOS smart invert, etc.) that this
           page already handles its own dark theme. Without this, some mobile browsers forcibly
           re-theme form fields -- injecting a light/white background behind the input while the
           page's own light text color stays as-is, which makes whatever you type invisible
           (white text on a white box the browser added on top of our dark background). */
        html {
            color-scheme: dark;
        }

        /* Reset native OS form-control chrome so our own background/text colors always win,
           instead of the mobile browser rendering its own default (usually white) control. */
        input, select, textarea, button {
            color-scheme: dark;
            -webkit-appearance: none;
            appearance: none;
        }

        input, select, textarea {
            background-color: #020617 !important;
            color: #ffffff !important;
        }

        input::placeholder, textarea::placeholder {
            color: #64748b !important;
            opacity: 1;
        }

        /* Fix mobile Chrome / iOS Safari autofill white text and background bugs */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0px 1000px #020617 inset !important;
            box-shadow: 0 0 0px 1000px #020617 inset !important;
            caret-color: #ffffff;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* iOS Safari auto-zooms the whole page on focus if an input's font-size is under 16px.
           That zoom is what makes the layout look "overlapping"/broken on mobile once the
           keyboard opens. Forcing 16px on small screens stops the zoom without changing the
           visual size we show on larger screens (sm: classes still control that). */
        @media (max-width: 640px) {
            input, select, textarea {
                font-size: 16px !important;
            }
        }

        /* Smooth touch scrolling for mobile */
        body {
            -webkit-overflow-scrolling: touch;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>

    <script>
      const SUPABASE_URL = 'https://fhophxqeoeowhgqlihzq.supabase.co';
      const SUPABASE_ANON_KEY = 'sb_publishable_moji8A_nvf8TRP1NsGKlyg_jlup6r6d';

      // Safe lazy initializer prevents crashes on slower mobile connections
      function getSupabase() {
          if (window.supabaseClient && window.supabaseClient.auth) {
              return window.supabaseClient;
          }
          const lib = window.supabase;
          if (lib && typeof lib.createClient === 'function') {
              window.supabaseClient = lib.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
              return window.supabaseClient;
          }
          return null;
      }
    </script>
</head>
<body class="min-h-dvh bg-slate-950 text-slate-100 flex flex-col items-center justify-center p-4 sm:p-6 py-8 sm:py-12 overflow-y-auto">

    <!-- Container Card with responsive padding & sizing -->
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-5 sm:p-8 rounded-2xl shadow-xl space-y-5 sm:space-y-6 my-auto">
        
        <!-- Header with Logo -->
        <div class="text-center space-y-2 sm:space-y-3">
            <img src="logo.png" alt="EasyConnect Logo" class="h-20 w-20 sm:h-28 sm:w-28 mx-auto object-contain rounded-xl bg-slate-800/80 p-2 border border-slate-700 shadow-lg" onerror="this.src='https://placehold.co/112x112/indigo/white?text=EasyConnect'">
            <div>
                <h1 class="text-lg sm:text-xl font-bold text-white tracking-tight">Create Account</h1>
                <p class="text-xs text-slate-400 mt-0.5">Join the EasyConnect platform</p>
            </div>
        </div>

        <form id="register-form" onsubmit="handleRegister(event)" class="space-y-3.5 sm:space-y-4">
            
            <!-- First Name & Last Name (Stacks automatically on smaller mobile screens) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">First Name</label>
                    <input type="text" id="reg-firstname" required placeholder="John" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 sm:py-2.5 text-sm sm:text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Last Name</label>
                    <input type="text" id="reg-lastname" required placeholder="Doe" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 sm:py-2.5 text-sm sm:text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                <input type="email" id="reg-email" required placeholder="name@example.com" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 sm:py-2.5 text-sm sm:text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Phone Number</label>
                <input type="tel" id="reg-phone" required placeholder="08012345678" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 sm:py-2.5 text-sm sm:text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                <input type="password" id="reg-password" required minlength="6" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 sm:py-2.5 text-sm sm:text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Confirm Password</label>
                <input type="password" id="reg-confirmpassword" required minlength="6" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-3 sm:py-2.5 text-sm sm:text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <p id="reg-error" class="text-xs text-rose-400 hidden font-medium leading-relaxed"></p>
            <p id="reg-success" class="text-xs text-emerald-400 hidden font-medium leading-relaxed">Registration successful! Redirecting...</p>
            
            <button type="submit" id="reg-btn" class="cursor-pointer w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 sm:py-3 rounded-xl transition text-xs shadow-lg shadow-indigo-600/20 active:scale-[0.98]">
                Complete Sign Up
            </button>
        </form>

        <p class="text-xs text-center text-slate-400">
            Already have an account? <a href="login.html" class="text-indigo-400 font-semibold hover:underline">Sign In</a>
        </p>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            
            const btn = document.getElementById('reg-btn');
            const errEl = document.getElementById('reg-error');
            const succEl = document.getElementById('reg-success');
            
            errEl.classList.add('hidden');
            succEl.classList.add('hidden');

            const firstName = document.getElementById('reg-firstname').value.trim();
            const lastName = document.getElementById('reg-lastname').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirmpassword').value;

            if (password !== confirmPassword) {
                errEl.innerText = "Passwords do not match.";
                errEl.classList.remove('hidden');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = "Processing...";

                // Retrieve verified Supabase client instance
                const client = getSupabase();
                if (!client || !client.auth) {
                    throw new Error("Supabase failed to load. Please refresh the page and try again.");
                }

                const { data, error } = await client.auth.signUp({
                    email,
                    password,
                    options: {
                        data: { first_name: firstName, last_name: lastName, phone: phone }
                    }
                });

                if (error) {
                    throw error;
                }

                succEl.classList.remove('hidden');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (err) {
                errEl.innerText = err.message || "An unexpected error occurred.";
                errEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "Complete Sign Up";
            }
        }
    </script>
</body>
</html>
